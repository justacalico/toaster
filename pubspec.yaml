name: toaster
description: "A pocket-sized Blender-style 3D modeler built with Flutter."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon-1024.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon-1024.png"
    background_color: "#1e1e22"
    theme_color: "#1e1e22"
  windows:
    generate: true
    image_path: "assets/icon-1024.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon-1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
